name: Frontend Master Deploy to S3
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Project Checkout
        uses: actions/checkout@v2

      - name: Install NPM v24.11.0
        uses: actions/setup-node@v1
        with:
          node-version: '24.11.0'

      - name: NPM install...
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      
      # ===================================================================
      # BUILD FOR main branch
      # ===================================================================

      - name: Fetch latest lang/en.js and config/index.js
        run: |
          aws s3 cp s3://${{ secrets.STORAGE_BUCKET }}/lang-customer.js src/lang/en.js
          aws s3 cp s3://${{ secrets.STORAGE_BUCKET }}/config-betcustomer.js src/config/index.js
      
      - name: Build frontend for bucket 2
        run: npm run build
        
      - name: Upload to AWS bucket 2
        run: |
          aws s3 rm s3://${{ secrets.BUCKET_NAME_2 }}/ --recursive
          aws s3 cp dist s3://${{ secrets.BUCKET_NAME_2 }}/ --recursive

      - name: Deploy to Bucket 2
        uses: lbertenasco/s3-deploy@v1
        with:
          folder: dist
          bucket: ${{ secrets.BUCKET_NAME_2 }}
          dist-id: ${{ secrets.CLOUDFRONT_ID_2 }}
          invalidation: / *
