name: Frontend Master Deploy to S3
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Project Checkout
        uses: actions/checkout@v2

      - name: Install NPM v24.11.0
        uses: actions/setup-node@v1
        with:
          node-version: '24.11.0'

      - name: NPM install...
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
          
      # Download lang/en.js from S3 and overwrite local file
    # - name: Fetch latest lang/en.js from S3
      # run: aws s3 cp s3://${{ secrets.STORAGE_BUCKET }}/lang-customer.js src/lang/en.js
        
      - name: Build frontend
        run: npm run build

      - name: Upload to AWS
        run: |
          aws s3 rm s3://${{ secrets.BUCKET_NAME }}/ --recursive
          aws s3 cp dist s3://${{ secrets.BUCKET_NAME }}/ --recursive

      - name: Deploy
        uses: lbertenasco/s3-deploy@v1
        with:
          folder: dist
          bucket: ${{ secrets.BUCKET_NAME }}
          dist-id: ENRU8NH5XA562
          invalidation: / *
